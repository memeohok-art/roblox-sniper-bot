# Fly.io — deploy without GitHub:  fly launch --no-deploy && fly deploy
# A worker has no HTTP service, so none is declared here.
app = "roblox-sniper"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_PATH = "/app/data/state.json"
  LOG_LEVEL = "INFO"
  GUILD_ID = "1570754134276313299"

[[mounts]]
  source = "sniper_data"
  destination = "/app/data"

[processes]
  app = "python bot.py"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[deploy]
  strategy = "immediate"
